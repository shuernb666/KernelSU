name: Shuer Manager

on:
  workflow_dispatch:
    inputs:
      keystore:
        description: 'base64 of JKS (optional, overrides random keygen)'
        required: false
      store_pass:
        description: 'keystore password (optional)'
        required: false

permissions:
  contents: read

jobs:
  key:
    runs-on: ubuntu-latest
    outputs:
      cert_size: ${{ steps.key.outputs.cert_size }}
      cert_hash: ${{ steps.key.outputs.cert_hash }}
      keystore_b64: ${{ steps.key.outputs.keystore_b64 }}
      store_pass: ${{ steps.key.outputs.store_pass }}
      alias: ${{ steps.key.outputs.alias }}
    steps:
      - name: Prepare signing key
        id: key
        env:
          IN_KS: ${{ inputs.keystore }}
          IN_PASS: ${{ inputs.store_pass }}
          S_KS: ${{ secrets.KEYSTORE }}
          S_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$IN_PASS" ]; then echo "::add-mask::$IN_PASS"; fi
          if [ -n "$S_KS" ]; then
            echo "$S_KS" | base64 -d > key.jks
            ALIAS="$S_ALIAS"; PASS="$S_PASS"
          elif [ -n "$IN_KS" ]; then
            echo "$IN_KS" | base64 -d > key.jks
            ALIAS=shuer; PASS="$IN_PASS"
          else
            PASS=$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
            ALIAS=shuer
            keytool -genkeypair -v -keystore key.jks -storetype JKS -alias "$ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=Shuer, OU=Shuer Mod, O=Shuer, L=CN, ST=CN, C=CN" \
              -storepass "$PASS" -keypass "$PASS"
          fi
          keytool -exportcert -alias "$ALIAS" -keystore key.jks -storepass "$PASS" -file cert.der
          SIZE_HEX=$(printf '0x%04x' $(stat -c%s cert.der))
          HASH=$(sha256sum cert.der | awk '{print $1}')
          echo "cert_size=$SIZE_HEX" >> $GITHUB_OUTPUT
          echo "cert_hash=$HASH" >> $GITHUB_OUTPUT
          echo "keystore_b64=$(base64 -w0 key.jks)" >> $GITHUB_OUTPUT
          echo "store_pass=$PASS" >> $GITHUB_OUTPUT
          echo "alias=$ALIAS" >> $GITHUB_OUTPUT
          echo "cert: $SIZE_HEX / $HASH"

  lkm:
    needs: key
    uses: ./.github/workflows/build-lkm.yml
    with:
      package_name: com.shuer.cn
      expected_size: ${{ needs.key.outputs.cert_size }}
      expected_hash: ${{ needs.key.outputs.cert_hash }}

  apk:
    needs: key
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - name: Build ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo build --target aarch64-linux-android --release --manifest-path ./userspace/ksud/Cargo.toml
          source .github/scripts/setup-rust-build.sh x86_64-linux-android 26
          cargo build --target x86_64-linux-android --release --manifest-path ./userspace/ksud/Cargo.toml

      - name: Apply custom launcher icon
        run: |
          set -e
          command -v convert >/dev/null || sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          mkdir -p manager/app/src/main/res/drawable-xxxhdpi
          convert branding/shuer-icon.jpg -resize 1024x1024^ -gravity center -extent 1024x1024 /tmp/sq.png
          convert /tmp/sq.png -resize 264x264 -background none -gravity center -extent 432x432 manager/app/src/main/res/drawable-xxxhdpi/shuer_icon.png
          for d in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324; do
            dens=${d%%:*}; px=${d##*:}
            mkdir -p manager/app/src/main/res/drawable-$dens
            convert /tmp/sq.png -resize $((px*66/108))x$((px*66/108)) -background none -gravity center -extent ${px}x${px} manager/app/src/main/res/drawable-$dens/shuer_icon.png
          done
          identify manager/app/src/main/res/drawable-xxxhdpi/shuer_icon.png

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ needs.key.outputs.keystore_b64 }}
          STORE_PASS: ${{ needs.key.outputs.store_pass }}
          KEY_ALIAS: ${{ needs.key.outputs.alias }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > key.jks
          {
            echo "KEYSTORE_FILE=$(pwd)/key.jks"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$STORE_PASS"
          } >> manager/gradle.properties

      - name: Build manager
        working-directory: ./manager
        run: ./gradlew clean assembleRelease -PKSU_PACKAGE_NAME=com.shuer.cn -PKSU_NAME=鼠二

      - name: Repack and sign
        env:
          STORE_PASS: ${{ needs.key.outputs.store_pass }}
          ALIAS: ${{ needs.key.outputs.alias }}
        run: |
          set -e
          python3 repack_apk.py repack -b release -t release -a arm64-v8a \
            -K key.jks -A "$ALIAS" -P "$STORE_PASS" -S "$STORE_PASS" \
            -n "Shuer_$(date +%Y%m%d)" --strip
          ls -la dist/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: shuer-apk
          path: dist/*.apk

      - name: Upload signing key bundle
        env:
          KEYSTORE_B64: ${{ needs.key.outputs.keystore_b64 }}
          STORE_PASS: ${{ needs.key.outputs.store_pass }}
          CERT_HASH: ${{ needs.key.outputs.cert_hash }}
          CERT_SIZE: ${{ needs.key.outputs.cert_size }}
        run: |
          cat > signing-key.txt <<EOF
          keystore_base64=$KEYSTORE_B64
          keystore_password=$STORE_PASS
          key_alias=shuer
          cert_sha256=$CERT_HASH
          cert_size=$CERT_SIZE
          EOF

      - name: Upload key bundle
        uses: actions/upload-artifact@v7
        with:
          name: shuer-signing-key
          path: signing-key.txt
